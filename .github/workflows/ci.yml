name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify no external dependencies
        run: |
          deps=$(go list -m all | grep -v '^github.com/jchigg2000-git/piidetect$' || true)
          if [ -n "$deps" ]; then echo "unexpected module requirements:"; echo "$deps"; exit 1; fi
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=cover.out
      - name: Coverage stays over 90% (README claims it)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage $total%"
          awk -v t="$total" 'BEGIN { exit !(t > 90) }'
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
